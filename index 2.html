<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stadtrallye – Fotobewertung</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:linear-gradient(135deg,#1e1b4b,#4338ca 60%,#db2777) fixed;color:#1f2937;min-height:100vh}
#app{max-width:1100px;margin:0 auto;padding:16px}
.top{color:#fff;text-align:center;margin:8px 0 18px}.top small{letter-spacing:2px;font-weight:700;opacity:.85}.top h1{margin:4px 0;font-size:2rem}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 30px #0004;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
input,textarea,select{width:100%;padding:11px;border:2px solid #e5e7eb;border-radius:10px;font:inherit;margin:4px 0 10px}
input:focus,textarea:focus{outline:none;border-color:#6366f1}
button,.btn{background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;display:inline-block}
button.g{background:#e5e7eb;color:#374151}button.r{background:#ef4444}button:hover{filter:brightness(1.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:#ffffff30}.tabs button.on{background:#fff;color:#4338ca}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips button{background:#ffffff30}.chips button.on{background:#fff;color:#4338ca}
.ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#e5e7eb;cursor:zoom-in}
.lock{aspect-ratio:4/3;border-radius:12px;background:repeating-linear-gradient(45deg,#e5e7eb,#e5e7eb 10px,#f3f4f6 10px,#f3f4f6 20px);display:flex;align-items:center;justify-content:center;font-weight:700;color:#6b7280;text-align:center;padding:10px}
.st{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.st b{font-size:.95rem}
.st span button{background:none;color:#d1d5db;font-size:1.6rem;padding:0 2px}.st span button.on{color:#f59e0b}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f3f4f6}
.tag{background:#eef2ff;color:#4338ca;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700}
.mem{font-size:.85rem;color:#6b7280}
.light{color:#fff}.bar{height:10px;background:#ffffff40;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#fbbf24}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:9}
#cf{position:fixed;inset:0;pointer-events:none;display:none;z-index:8}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:7}#lb img{max-width:95%;max-height:95%;border-radius:10px}
.rk{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:#fff;margin-bottom:10px;font-size:1.3rem;font-weight:800;animation:pop .5s}
.rk.q{background:#ffffff25;color:#fff;opacity:.6;animation:none}.rk .n{font-size:1.8rem;width:50px}.rk .s{margin-left:auto;color:#d97706}
.rk.w{background:linear-gradient(135deg,#fde68a,#f59e0b);font-size:1.9rem;transform:scale(1.03)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.pw{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}.pc{border:2px dashed #6b7280;border-radius:10px;padding:12px;background:#fff}
.pc h4{margin:0 0 8px;font-size:.85rem;text-align:center;letter-spacing:1px}.pc code{font-size:1.6rem;font-weight:800;letter-spacing:4px;color:#4338ca}
@media print{body{background:#fff}.noprint{display:none!important}.card{box-shadow:none;padding:0}.pc{break-inside:avoid}#app{padding:0}}
</style></head><body>
<div id="app"></div><canvas id="cf"></canvas><div id="toast"></div><div id="lb" onclick="this.style.display='none'"><img></div>
<script>
// ====== EINSTELLUNGEN ======
const DB_URL="";            // Firebase Realtime-Database-URL, z.B. "https://mein-projekt-default-rtdb.europe-west1.firebasedatabase.app" (leer = Demo-Modus nur auf diesem Gerät)
const ADMIN_PW="admin123";  // BITTE ÄNDERN
// ===========================
const SCHOOL="GESAMTSCHULE SCHLOß HOLTE-STUKENBROCK";
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8),hs=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return'p'+h.toString(36)};
const gen=()=>Array.from({length:6},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
let L=JSON.parse(localStorage.rallyDemo||'{}'),M={points:[],groups:[],cats:[],priv:false,phase:'vote'},V={},P=new Set(),IMG={},R=0;
let me=JSON.parse(localStorage.rallyMe||'null'),admin=sessionStorage.rallyAdmin=='1',tab='points',sel=null;
const parts=p=>p.split('/').filter(Boolean);
async function get(p){if(DB_URL){const j=await(await fetch(DB_URL+p+'.json')).json();if(j&&j.error){toast('Firebase-Fehler: '+j.error);return null}return j}let o=L;for(const k of parts(p))o=o?.[k];return o??null}
async function put(p,v){if(DB_URL){await fetch(DB_URL+p+'.json',{method:'PUT',body:JSON.stringify(v)});return}const a=parts(p),l=a.pop();let o=L;for(const k of a)o=o[k]??={};o[l]=v;try{localStorage.rallyDemo=JSON.stringify(L)}catch(e){toast('Speicher voll (Demo-Modus)')}}
async function keys(){if(DB_URL){return Object.keys(await(await fetch(DB_URL+'/photos.json?shallow=true')).json()||{})}return Object.keys(L.photos||{})}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
async function load(){const m=await get('/meta');if(!m&&!M.cats.length)M.cats=[{id:'c1',n:'Lustigkeit'},{id:'c2',n:'Kreativität'}];else if(m)M={...M,...m};['points','groups','cats'].forEach(k=>M[k]=Object.values(M[k]||{}));M.groups.forEach(g=>g.m=Object.values(g.m||{}));V=await get('/votes')||{};P=new Set(await keys())}
const sv=()=>put('/meta',M);
async function img(k){if(!IMG[k])IMG[k]=await get('/photos/'+k);return IMG[k]}
function fill(){document.querySelectorAll('img[data-k]').forEach(async e=>{const d=await img(e.dataset.k);if(d)e.src=d;e.onclick=()=>{$('#lb img').src=e.src;$('#lb').style.display='flex'}})}
const head=`<div class="top"><small>${SCHOOL}</small><h1>📸 Stadtrallye – Fotobewertung</h1></div>`;
function render(){let h=head+(DB_URL?'':'<div class="card" style="background:#fef3c7">⚠️ <b>Demo-Modus:</b> Daten werden nur auf diesem Gerät gespeichert. Trage die Firebase-URL bei DB_URL ein.</div>');if(admin)h+=adminV();else if(me)h+=voteV();else h+=loginV();$('#app').innerHTML=h;fill();if(admin&&tab=='qr')new QRCode($('#qr'),{text:location.href.split('#')[0].split('?')[0],width:300,height:300})}
// ---------- Login ----------
function loginV(){return`<div class="card" style="max-width:460px;margin:auto"><h2>Mitmachen</h2><label>Vorname</label><input id="f" autocomplete="off"><label>Nachname</label><input id="l" autocomplete="off">${M.priv?'<label>Passwort</label><input id="pw" autocomplete="off" style="text-transform:uppercase">':''}<button onclick="login()" style="width:100%">Los geht's →</button><p style="text-align:center;margin:14px 0 0"><a href="#" onclick="adm();return false" class="mem">Admin</a></p></div>`}
function login(){const f=$('#f').value.trim(),l=$('#l').value.trim(),pw=($('#pw')?.value||'').trim().toUpperCase();if(!f||!l)return toast('Bitte Vor- und Nachnamen eingeben');
const n=s=>s.toLowerCase().replace(/\s+/g,' ');let g=null,mem=null;for(const G of M.groups)for(const x of G.m)if(n(x.f)==n(f)&&n(x.l)==n(l)){g=G;mem=x}
if(M.priv&&(!mem||mem.p!==pw))return toast('Name oder Passwort falsch');
me={id:mem?mem.id:hs(n(f+' '+l)),f,l,g:g?.id};localStorage.rallyMe=JSON.stringify(me);render()}
function adm(){const p=prompt('Admin-Passwort:');if(p===ADMIN_PW){admin=true;sessionStorage.rallyAdmin='1';render()}else if(p!==null)toast('Falsches Passwort')}
function out(){me=null;admin=false;localStorage.removeItem('rallyMe');sessionStorage.removeItem('rallyAdmin');render()}
// ---------- Schüler ----------
function voteV(){const cs=M.cats,pts=M.points;if(!sel||!pts.find(p=>p.id==sel))sel=pts[0]?.id;
let tot=0,done=0;for(const p of pts)for(const g of M.groups)if(g.id!=me.g&&P.has(g.id+'_'+p.id))for(const c of cs){tot++;if(V[me.id]?.[g.id+'_'+p.id]?.[c.id])done++}
const pct=tot?done/tot*100:0;
let h=`<div class="light" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>Hallo ${esc(me.f)} ${esc(me.l)} 👋</b><button class="g" onclick="out()">Abmelden</button></div>`;
if(M.phase!='vote')return h+`<div class="card" style="text-align:center"><h2>🔒 Die Bewertung ist beendet</h2><p>Schau nach vorne – gleich kommt die Siegerehrung!</p></div>`;
if(M.live?.on&&pts.length&&cs.length)return liveV(h);
if(!pts.length||!cs.length)return h+`<div class="card">Es ist noch nichts eingerichtet. Bitte kurz warten …</div>`;
h+=`<div class="light mem" style="color:#fff">Fortschritt: ${done} von ${tot} Bewertungen</div><div class="bar" style="margin:6px 0 14px"><i style="width:${pct}%"></i></div><div class="chips">${pts.map(p=>`<button class="${p.id==sel?'on':''}" onclick="sel='${p.id}';render()">${esc(p.n)}</button>`).join('')}</div><div class="grid">`;
for(const g of M.groups){const k=g.id+'_'+sel;
if(g.id==me.g){h+=`<div class="card"><div class="lock">🔒 Deine Gruppe (${esc(g.n)})<br>darf nicht von dir bewertet werden</div></div>`;continue}
if(!P.has(k))continue;
h+=`<div class="card"><img class="ph" data-k="${k}"><div style="margin:8px 0"><b>${esc(g.n)}</b></div>${cs.map(c=>`<div class="st"><b>${esc(c.n)}</b><span>${[1,2,3,4,5].map(n=>`<button class="${(V[me.id]?.[k]?.[c.id]||0)>=n?'on':''}" onclick="rate('${k}','${c.id}',${n})">★</button>`).join('')}</span></div>`).join('')}</div>`}
return h+'</div>'}
async function rate(k,c,n){((V[me.id]??={})[k]??={})[c]=n;put(`/votes/${me.id}/${k}/${c}`,n);render()}
// ---------- Admin ----------
const T={points:'📍 Punkte',groups:'👥 Gruppen',photos:'🖼️ Fotos',cats:'⭐ Kategorien',set:'⚙️ Einstellungen',pw:'🔑 Passwörter',qr:'📱 QR-Code',live:'🎬 Live',res:'🏆 Ergebnis'};
function adminV(){let h=`<div class="tabs noprint">${Object.entries(T).map(([k,v])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}<button class="g" onclick="out()">Abmelden</button></div>`;
return h+({points:pV,groups:gV,photos:fV,cats:cV,set:sV,pw:wV,qr:()=>`<div class="card" style="text-align:center"><h2>Scannen & mitmachen</h2><div id="qr" style="display:inline-block"></div><p>${esc(location.href.split('#')[0])}</p></div>`,live:lV,res:rV}[tab])()}
async function go(t){tab=t;if(t=='res'||t=='live'){await load();R=0}render()}
const pV=()=>`<div class="card"><h2>Foto-Punkte</h2><div style="display:flex;gap:8px"><input id="np" placeholder="z.B. Rathaus, Brunnen, Bahnhof …" onkeydown="if(event.key=='Enter')addP()"><button onclick="addP()" style="height:46px;margin-top:4px">+</button></div>${M.points.map(p=>`<div class="row"><span>📍 ${esc(p.n)}</span><button class="r" onclick="del('points','${p.id}')">✕</button></div>`).join('')||'<p class="mem">Noch keine Punkte.</p>'}</div>`;
async function addP(){const v=$('#np').value.trim();if(!v)return;M.points.push({id:'p'+uid(),n:v});await sv();render()}
const cV=()=>`<div class="card"><h2>Bewertungs-Kategorien (1–5 Sterne)</h2><div style="display:flex;gap:8px"><input id="nc" placeholder="z.B. Lustigkeit" onkeydown="if(event.key=='Enter')addC()"><button onclick="addC()" style="height:46px;margin-top:4px">+</button></div>${M.cats.map(c=>`<div class="row"><span>⭐ ${esc(c.n)}</span><button class="r" onclick="del('cats','${c.id}')">✕</button></div>`).join('')}</div>`;
async function addC(){const v=$('#nc').value.trim();if(!v)return;M.cats.push({id:'c'+uid(),n:v});await sv();render()}
async function del(k,id){if(!confirm('Wirklich löschen?'))return;M[k]=M[k].filter(x=>x.id!=id);await sv();render()}
const gV=()=>`<div class="card"><h2>Neue Gruppe</h2><input id="gn" placeholder="Gruppenname"><textarea id="gm" rows="4" placeholder="Ein Name pro Zeile: Vorname Nachname"></textarea><button onclick="addG()">Gruppe anlegen</button></div>${M.groups.map(g=>`<div class="card"><div class="row" style="border:0"><h3 style="margin:0">${esc(g.n)} <span class="tag">${g.m.length} Personen</span></h3><button class="r" onclick="del('groups','${g.id}')">✕</button></div><div class="mem">${g.m.map(x=>esc(x.f+' '+x.l)).join(' · ')}</div></div>`).join('')}`;
async function addG(){const n=$('#gn').value.trim(),m=$('#gm').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const a=s.split(/\s+/);return{id:'u'+uid(),f:a[0],l:a.slice(1).join(' ')||'-',p:gen()}});if(!n||!m.length)return toast('Name und Mitglieder angeben');M.groups.push({id:'g'+uid(),n,m});await sv();render()}
const fV=()=>!M.groups.length||!M.points.length?'<div class="card">Lege zuerst Punkte und Gruppen an.</div>':M.groups.map(g=>`<div class="card"><h3>${esc(g.n)}</h3><div class="grid">${M.points.map(p=>{const k=g.id+'_'+p.id;return`<div><b>${esc(p.n)}</b>${P.has(k)?`<img class="ph" data-k="${k}">`:'<div class="lock">kein Foto</div>'}<input type="file" accept="image/*" onchange="up('${k}',this.files[0])"></div>`}).join('')}</div></div>`).join('');
function up(k,f){if(!f)return;const i=new Image;i.onload=async()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.72);IMG[k]=d;await put('/photos/'+k,d);P.add(k);toast('Foto gespeichert ✓');render()};i.src=URL.createObjectURL(f)}
const sV=()=>`<div class="card"><h2>Einstellungen</h2><label><input type="checkbox" style="width:auto" ${M.priv?'checked':''} onchange="M.priv=this.checked;sv();render()"> <b>Privater Modus</b> (Name + Passwort nötig, Passwörter siehe Tab „Passwörter")</label><p class="mem">Aus = jeder kann mit Vor- und Nachnamen mitmachen. Eigene Gruppe ist in beiden Modi gesperrt, sofern der Name in einer Gruppe steht.</p><hr><label><input type="checkbox" style="width:auto" ${M.phase=='vote'?'checked':''} onchange="M.phase=this.checked?'vote':'closed';sv();render()"> <b>Bewertung geöffnet</b></label><hr><button class="r" onclick="if(confirm('ALLE Stimmen löschen?')){put('/votes',null);V={};toast('Stimmen gelöscht')}">Alle Stimmen löschen</button></div>`;
const wV=()=>`<div class="noprint" style="margin-bottom:10px"><button onclick="print()">🖨️ Drucken</button></div><div class="pw">${M.groups.flatMap(g=>g.m.map(x=>`<div class="pc"><h4>${SCHOOL}</h4><div><b>${esc(x.f)} ${esc(x.l)}</b> <span class="mem">(${esc(g.n)})</span></div><div>Passwort: <code>${x.p}</code></div><div class="mem">${esc(location.host+location.pathname)}</div></div>`)).join('')||'<div class="card">Noch keine Gruppen.</div>'}</div>`;
// ---------- Live ----------
const seq=()=>M.points.flatMap(p=>M.groups.filter(g=>P.has(g.id+'_'+p.id)).map(g=>({k:g.id+'_'+p.id,g,p})));
const liveI=s=>Math.max(0,Math.min(M.live?.i||0,s.length-1));
const vcount=()=>{const s=seq(),c=s[liveI(s)];return c?Object.values(V).filter(u=>u&&u[c.k]).length:0};
async function liveSet(l){M.live=l;await sv();render()}
function lV(){const s=seq(),i=liveI(s),c=s[i];
if(!M.live?.on)return`<div class="card" style="text-align:center"><h2>🎬 Live-Präsentation</h2><p>Alle sehen gleichzeitig dasselbe Foto auf dem eigenen Gerät und bewerten es. Du schaltest per Klick zum nächsten Foto weiter – ideal mit dem Beamer.</p><p><b>${s.length}</b> Fotos bereit</p><button onclick="liveSet({on:true,i:0})" ${s.length?'':'disabled'}>▶ Live starten</button></div>`;
if(!c)return'<div class="card">Keine Fotos.</div>';
return`<div class="light" style="text-align:center"><div class="tag">Foto ${i+1} von ${s.length}</div><h2 style="font-size:2rem;margin:8px 0">${esc(c.p.n)} – ${esc(c.g.n)}</h2><img class="ph" data-k="${c.k}" style="width:auto;max-width:100%;max-height:68vh;aspect-ratio:auto;object-fit:contain;cursor:default"><h3>🗳️ <span id="vc">${vcount()}</span> Stimmen</h3><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="g" onclick="liveSet({on:true,i:${Math.max(0,i-1)}})">◀ Zurück</button>${i<s.length-1?`<button onclick="liveSet({on:true,i:${i+1}})">Weiter ▶</button>`:`<button onclick="liveSet({on:false});go('res')">Zur Siegerehrung 🏆</button>`}<button class="r" onclick="liveSet({on:false})">Beenden</button></div></div>`}
function liveV(h){const s=seq(),i=liveI(s),c=s[i];if(!c)return h+"<div class='card'>Gleich geht's los …</div>";
return h+`<div class="light" style="text-align:center"><span class="tag">Foto ${i+1} von ${s.length}</span> <b>${esc(c.p.n)}</b></div><div class="card" style="max-width:520px;margin:12px auto"><img class="ph" data-k="${c.k}"><div style="margin:8px 0"><b>${esc(c.g.n)}</b></div>${c.g.id==me.g?'<div class="lock">🔒 Das ist dein eigenes Foto – du darfst nicht bewerten. Warte aufs nächste!</div>':M.cats.map(x=>`<div class="st"><b>${esc(x.n)}</b><span>${[1,2,3,4,5].map(n=>`<button class="${(V[me.id]?.[c.k]?.[x.id]||0)>=n?'on':''}" onclick="rate('${c.k}','${x.id}',${n})">★</button>`).join('')}</span></div>`).join('')}</div>`}
// ---------- Ergebnis ----------
function calc(){const G={},C={},Ph={};for(const u in V)for(const k in V[u])for(const c in V[u][k]){const n=+V[u][k][c],g=k.split('_')[0];for(const[o,key]of[[G,g],[C,g+'|'+c],[Ph,k]]){const e=o[key]??={s:0,n:0};e.s+=n;e.n++}}return{G,C,Ph}}
const av=e=>e&&e.n?e.s/e.n:0;
function rV(){const{G,C,Ph}=calc(),rk=[...M.groups].sort((a,b)=>av(G[b.id])-av(G[a.id])),N=rk.length;
let h=`<div class="light" style="text-align:center;margin-bottom:10px">${Object.keys(V).length} Teilnehmer haben abgestimmt <button class="g" onclick="go('res')">↻ Aktualisieren</button></div><div style="max-width:700px;margin:auto"><h2 class="light" style="text-align:center;font-size:2rem">${R>=N&&N?'🏆 Das Ergebnis!':'Und der Sieger ist … 🥁'}</h2>`;
rk.forEach((g,i)=>{const rev=i>=N-R;h+=rev?`<div class="rk ${i==0?'w':''}"><span class="n">${i==0?'👑':i+1+'.'}</span>${esc(g.n)}<span class="s">★ ${av(G[g.id]).toFixed(2)}</span></div>`:`<div class="rk q"><span class="n">${i+1}.</span>???</div>`});
if(N)h+=`<div style="text-align:center" class="noprint">${R<N?`<button onclick="nxt()" style="font-size:1.3rem;padding:14px 30px">${R==0?'Start ▶':'Nächster Platz ▶'}</button>`:`<button class="g" onclick="R=0;render()">Nochmal</button>`}</div>`;
h+='</div>';
if(R>=N&&N){h+=`<div class="grid" style="margin-top:20px">${M.cats.map(c=>{const b=[...M.groups].sort((a,z)=>av(C[z.id+'|'+c.id])-av(C[a.id+'|'+c.id]))[0];return`<div class="card" style="text-align:center"><div class="tag">${esc(c.n)}</div><h2>🥇 ${esc(b.n)}</h2>★ ${av(C[b.id+'|'+c.id]).toFixed(2)}</div>`}).join('')}`;
const bk=Object.keys(Ph).sort((a,b)=>av(Ph[b])-av(Ph[a]))[0];if(bk){const[gi,pi]=bk.split('_'),g=M.groups.find(x=>x.id==gi),p=M.points.find(x=>x.id==pi);h+=`<div class="card" style="text-align:center"><div class="tag">Bestes Einzelfoto</div><img class="ph" data-k="${bk}"><h3>${esc(g?.n)} – ${esc(p?.n)}</h3>★ ${av(Ph[bk]).toFixed(2)}</div>`}h+='</div>'}
return h}
function nxt(){R++;render();if(R>=M.groups.length)conf()}
